name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build MentalDesk.Tui.slnx -warnaserror

      - name: Test
        run: dotnet test MentalDesk.Tui.slnx --no-build

      - name: Pack
        run: dotnet pack src/MentalDesk.Tui -warnaserror -o artifacts

  aot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish Swatch
        run: dotnet publish src/Swatch -r linux-x64 -warnaserror
